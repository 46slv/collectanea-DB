name: Documentation error
description: 誤り・古い情報・不足している説明を報告する
title: "[Docs] "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: 対象ページ
      placeholder: https://46slv.github.io/collectanea-DB/...
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: 問題
      description: 何が誤っている、古い、分かりにくいと感じたかを書いてください。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 根拠・参考資料
      description: 公式資料、実機確認、再現手順などがあれば記載してください。
