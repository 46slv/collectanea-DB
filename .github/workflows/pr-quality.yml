name: PR quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-capture:
    name: Build and capture UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Install capture runtime
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.0
          npx playwright install --with-deps chromium

      - name: Start built site
        run: |
          npm run serve -- --host 127.0.0.1 --port 3000 > /tmp/collectanea-server.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/collectanea-DB/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/collectanea-server.log
          exit 1

      - name: Capture required states
        env:
          CAPTURE_BASE_URL: http://127.0.0.1:3000/collectanea-DB
          CAPTURE_OUTPUT: artifacts/visual
        run: |
          node scripts/capture-ui.mjs
          cp /tmp/collectanea-server.log artifacts/visual/server.log || true

      - name: Preserve server log on failure
        if: failure()
        run: |
          mkdir -p artifacts/visual
          cp /tmp/collectanea-server.log artifacts/visual/server.log || true
          cat /tmp/collectanea-server.log || true

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collectanea-visual-evidence
          path: artifacts/visual
          if-no-files-found: warn
          retention-days: 14
