name: Collectanea PR Quality
# Full checks run once per frozen integration candidate, not on every writer push.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: collectanea-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft &&
       startsWith(github.event.pull_request.head.ref, 'integration/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CC_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check candidate identity
        run: test "$(git rev-parse HEAD)" = "$CC_HEAD_SHA"
      - run: npm ci --no-audit --no-fund
      - name: Script syntax
        run: |
          for script in scripts/*.mjs; do node --check "$script"; done
      - name: Catalog and playground regressions
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Production build
        id: build
        run: npm run build
      - name: Install locked browser
        run: npx playwright install --with-deps chromium
      - name: Record exact candidate
        run: |
          mkdir -p artifacts/visual
          node -e 'const fs=require("fs"),cp=require("child_process");fs.writeFileSync("artifacts/visual/candidate.json",JSON.stringify({head:process.env.CC_HEAD_SHA,tested:cp.execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),dirty:cp.execFileSync("git",["status","--porcelain"],{encoding:"utf8"}),node:process.version},null,2))'
          git archive --format=tar.gz HEAD > artifacts/source-snapshot.tar.gz
      - name: Serve production and verify real UI states
        run: |
          npm run serve -- --host 127.0.0.1 --port 3000 --no-open > artifacts/visual/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for n in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/collectanea-DB/ > /dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/collectanea-DB/ > /dev/null
          npm run capture
      - name: Ordinary Markdown integration and cleanup
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:content
      - name: Record post-test source cleanliness
        if: always()
        run: |
          mkdir -p artifacts/visual
          git status --porcelain > artifacts/visual/source-status-after.txt
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collectanea-visual-evidence
          path: artifacts/visual
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collectanea-built-site
          path: build
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collectanea-source-snapshot
          path: artifacts/source-snapshot.tar.gz
          retention-days: 14
          if-no-files-found: warn
