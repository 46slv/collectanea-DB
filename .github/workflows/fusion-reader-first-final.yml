name: Fusion reader-first final readiness
on:
  push:
    branches: [verify/fusion-reader-first-final-20261005]
    paths: [.github/workflows/fusion-reader-first-final.yml, checks/fusion-reader-first-final.mjs]
permissions:
  contents: read
concurrency:
  group: fusion-reader-first-final
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CC_EXPECTED_SHA: fdb4b61c03143dfcb6b1363f302c3d87f27160f1
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CC_EXPECTED_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Existing regressions
        run: npm run test:regressions
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Final reader-first browser verification
        run: |
          mkdir -p artifacts/reader-first-final
          npm run serve -- --host 127.0.0.1 --port 3000 --no-open > artifacts/reader-first-final/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for n in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/collectanea-DB/ > /dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/collectanea-DB/ > /dev/null
          node ../harness/checks/fusion-reader-first-final.mjs
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fusion-reader-first-final-evidence
          path: candidate/artifacts/reader-first-final
          retention-days: 14
          if-no-files-found: warn
