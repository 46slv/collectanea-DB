name: Materialize Fusion Node Reference

on:
  push:
    branches:
      - docs/fusion-complete-node-reference-20261003

permissions:
  contents: write

concurrency:
  group: fusion-node-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: true
      EXPECTED_ARCHIVE_SHA256: b386bb6b20f4f7b61a499fe82c2748101cd733bfad013f4573455f3d585453ea
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reassemble and expand generated reference pages
        shell: bash
        run: |
          set -euo pipefail
          cat .node-payload/part-* > /tmp/fusion-node-pages.tar.gz
          echo "${EXPECTED_ARCHIVE_SHA256}  /tmp/fusion-node-pages.tar.gz" | sha256sum -c -
          test "$(tar -tzf /tmp/fusion-node-pages.tar.gz | wc -l)" -eq 340
          tar -xzf /tmp/fusion-node-pages.tar.gz
          rm -rf .node-payload
          rm .github/workflows/materialize-fusion-nodes.yml

      - name: Validate node corpus structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('manuals/fusion/nodes')
          pages = sorted(p for p in root.rglob('*.md') if p.name != 'index.md')
          assert len(pages) == 359, f'expected 359 node pages, got {len(pages)}'

          term_ids = {}
          generated = []
          required_headings = (
              '## 概要',
              '## 入力と出力',
              '## 主な用途',
              '## 使うときの判断',
              '## 最小構成',
              '## 注意点',
              '## バージョンと検証状況',
          )

          for page in pages:
              text = page.read_text(encoding='utf-8')
              assert re.search(r'^doc_type:\s*node\s*$', text, re.MULTILINE), page
              match = re.search(
                  r'^term_id:\s*(?:"([^"]+)"|\'([^\']+)\'|([^\s#]+))\s*$',
                  text,
                  re.MULTILINE,
              )
              assert match, f'missing term_id: {page}'
              term_id = next(value for value in match.groups() if value is not None)
              assert term_id not in term_ids, f'duplicate term_id {term_id}: {term_ids.get(term_id)} / {page}'
              term_ids[term_id] = page

              if 'updated: "2026-10-03"' in text:
                  generated.append(page)
                  assert re.search(r'^verification:\s*partial\s*$', text, re.MULTILINE), page
                  assert re.search(r'^term_short:', text, re.MULTILINE), page
                  for heading in required_headings:
                      assert heading in text, f'{page}: missing {heading}'

          assert len(generated) == 328, f'expected 328 generated pages, got {len(generated)}'
          assert not Path('.node-payload').exists()
          print(f'validated {len(pages)} node pages; generated={len(generated)}; unique_term_ids={len(term_ids)}')
          PY
          git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Catalog model regressions
        run: npm run test:regressions

      - name: Production build
        run: npm run build

      - name: Install locked browser
        run: npx playwright install --with-deps chromium

      - name: Ordinary Markdown integration and cleanup
        run: npm run test:content

      - name: Commit verified static pages
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .node-payload
          test ! -e .github/workflows/materialize-fusion-nodes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: complete Fusion node reference"
          git push origin "HEAD:${GITHUB_REF_NAME}"
