name: Fusion PR12 integration readiness
# Validation-only branch. Do not merge this workflow or checks/ into main.
# The site is built from the exact PR12 candidate commit.
on:
  push:
    branches: [verify/fusion-pr12-integration-20261003]
    paths: [.github/workflows/fusion-pr12-integration.yml, checks/**]
permissions:
  contents: read
concurrency:
  group: fusion-pr12-integration
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC_EXPECTED_SHA: 2232547a6e282a2053715bacf6d658211a253996
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CC_EXPECTED_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Existing catalog regressions
        run: npm run test:regressions
      - name: Production build
        run: npm run build
      - name: Install locked Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify integrated reader flow and 21.1 coverage
        run: |
          mkdir -p artifacts/pr12-integration
          npm run serve -- --host 127.0.0.1 --port 3000 --no-open > artifacts/pr12-integration/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for n in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/collectanea-DB/ > /dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/collectanea-DB/ > /dev/null
          node ../harness/checks/fusion12.mjs
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fusion-pr12-integration-evidence
          path: candidate/artifacts/pr12-integration
          retention-days: 14
          if-no-files-found: warn
