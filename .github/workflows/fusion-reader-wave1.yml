name: Fusion reader-first wave 2 readiness
# Validation-only branch. Do not merge this workflow or checks/ into main.
on:
  push:
    branches: [verify/fusion-reader-first-wave2-20261004]
    paths: [.github/workflows/fusion-reader-wave1.yml, checks/fusion-reader-wave2.mjs]
permissions:
  contents: read
concurrency:
  group: fusion-reader-wave2
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC_EXPECTED_SHA: 9c101aa14b3293ba131293f717c5ae7bc026123c
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CC_EXPECTED_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Existing regressions
        run: npm run test:regressions
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser check
        run: |
          mkdir -p artifacts/reader-first-wave2
          npm run serve -- --host 127.0.0.1 --port 3000 --no-open > artifacts/reader-first-wave2/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for n in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/collectanea-DB/ > /dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/collectanea-DB/ > /dev/null
          node ../harness/checks/fusion-reader-wave2.mjs
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fusion-reader-first-wave2-evidence
          path: candidate/artifacts/reader-first-wave2
          retention-days: 14
          if-no-files-found: warn
