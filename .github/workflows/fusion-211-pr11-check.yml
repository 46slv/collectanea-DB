name: Fusion 21.1 PR11 merge-readiness
# Validation-only branch. Do not merge this workflow or checks/ into main.
# The site is built from the exact PR commit, not from this validation branch.
on:
  push:
    branches: [verify/fusion-211-pr11-20261003]
    paths: [.github/workflows/fusion-211-pr11-check.yml, checks/**]
permissions:
  contents: read
concurrency:
  group: fusion-211-pr11-check
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC_EXPECTED_SHA: 3fcb02cf3cfbfcabbe027c311e85d5c8349edb7a
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CC_EXPECTED_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Existing catalog regressions
        run: npm run test:regressions
      - name: Production build
        run: npm run build
      - name: Install locked Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify changed pages, indexes, search and responsive rendering
        run: |
          mkdir -p artifacts/merge-ready
          npm run serve -- --host 127.0.0.1 --port 3000 --no-open > artifacts/merge-ready/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for n in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/collectanea-DB/ > /dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/collectanea-DB/ > /dev/null
          node ../harness/checks/fusion211.mjs
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fusion-211-pr11-merge-evidence
          path: candidate/artifacts/merge-ready
          retention-days: 14
          if-no-files-found: warn
